    # projet thèse professionnelle
    - type: id_cybersecurity
      project_name: "Mise en place d’un SIEM applicatif à la HAS"
      project_excerpt: "Étude et déploiement d’une solution SIEM et de supervision applicative"
      img: "<img src='/assets/img/projects/logo-has.svg  style=width:60%; max-width:400px;'>" 
      img_title: "Logo Haute Autorité de Santé"
      date: "2024-09-05"
      post: |
        # Mise en place d’un SIEM applicatif à la Haute Autorité de Santé : retour d’expérience  

        La cybersécurité occupe une place de plus en plus centrale dans les organisations publiques et privées. 
        Dans le cadre de ma thèse professionnelle du Mastère Spécialisé *Expert Forensique et Cybersécurité*, 
        j’ai conduit une étude sur la **mise en place d’un SIEM (Security Information and Event Management)** 
        dédié à l’infrastructure applicative de la **Haute Autorité de Santé (HAS)**.  

        ## 🎯 Pourquoi un SIEM applicatif ?  
        À la HAS, un SIEM existait déjà pour l’infrastructure réseau et les postes de travail.  
        Mais il manquait une visibilité sur les **applications critiques**, essentielles pour la sécurité.  
        L’objectif était d’améliorer la détection des menaces et la réactivité face aux incidents.  

        ## 🛠️ La solution mise en œuvre  
        - Installation et configuration de **Wazuh** et de ses agents sur SIAM et Pacte  
        - Collecte et centralisation des logs (systèmes, bases de données, applications)  
        - Mise en place de la détection de vulnérabilités, du contrôle d’intégrité, et intégration avec **Jira**  
        - Déploiement d’une supervision complémentaire avec **Prometheus et Grafana**  

        ## ✅ Résultats et enseignements  
        - Visibilité accrue sur les applications critiques  
        - Réactivité renforcée face aux incidents  
        - Anticipation des vulnérabilités  
        - Tableaux de bord clairs et personnalisés  

        ## 🔮 Perspectives  
        - Automatisation de la réponse aux incidents (**Active Response**)  
        - Intégration avec d’autres outils comme **Snort IDS**  
        - Développement de la conformité réglementaire (RGPD, NIS2)  
        - Extension vers les environnements cloud et Kubernetes  

        ## 🏁 Conclusion  
        Ce projet démontre qu’une solution open source comme **Wazuh**, associée à **Grafana** et **Prometheus**, 
        peut répondre efficacement aux enjeux de sécurité et de performance des applications critiques.  
        Il constitue un réel tremplin pour renforcer la cybersécurité des organisations.  
        
    # phishing & social engineering       
    - type: id_cybersecurity
      project_name: "Phishing & Social Engineering - Analyse et simulation"
      project_excerpt: "Étude des techniques de phishing, manipulation des utilisateurs et simulation en pentest"
      img: "/assets/img/projects/phishing.svg"
      img_title: "Phishing"
      date: "2026-04-12"
      post: |
        # Phishing & Social Engineering : comprendre et exploiter le facteur humain

        Dans le cadre de ma montée en compétences en cybersécurité, j’ai étudié les mécanismes du **phishing** en adoptant une approche orientée **test d’intrusion**.

        Ce travail met en évidence une réalité clé :  
        > la majorité des attaques ne ciblent pas les systèmes, mais les **utilisateurs**.

        ---

        ## 🎯 Objectifs

        - Comprendre les mécanismes du phishing  
        - Identifier les techniques utilisées par les attaquants  
        - Analyser les leviers psychologiques exploités  
        - Étudier son utilisation dans une démarche de pentest  

        ---

        ## 🧠 Le phishing : une attaque centrée sur l’humain

        Le phishing est une technique de **social engineering** visant à tromper une victime en usurpant une identité légitime (entreprise, service IT, collègue).

        Les principaux objectifs sont :
        - Vol d’identifiants  
        - Accès non autorisé à un système  
        - Installation de malware  
        - Fraude  

        Les vecteurs d’attaque incluent les emails, SMS (smishing), appels téléphoniques (vishing) et sites web frauduleux.

        ---

        ## 🎣 Typologies d’attaques

        - **Phishing de masse** : messages génériques envoyés à grande échelle  
        - **Spear phishing** : attaques ciblées et personnalisées  
        - **Whaling** : ciblage des profils à forte responsabilité (direction, finance)  

        ---

        ## 🧩 Techniques utilisées

        Les attaquants disposent de nombreuses techniques pour tromper leurs cibles.

        ### 📧 Email spoofing

        L’email spoofing consiste à usurper l’identité de l’expéditeur :

        - Modification du champ "From"  
        - Display name trompeur  
        - Utilisation de domaines similaires  

        👉 Cette technique est facilitée par les limites du protocole SMTP.

        **Contre-mesures :**
        
        - **SPF (Sender Policy Framework)** : permet de vérifier que le serveur expéditeur est autorisé à envoyer des emails pour un domaine donné.  
        - **DKIM (DomainKeys Identified Mail)** : ajoute une signature cryptographique aux emails pour garantir leur intégrité et leur authenticité.  
        - **DMARC (Domain-based Message Authentication, Reporting & Conformance)** : s’appuie sur SPF et DKIM pour définir une პოლიტique de traitement des emails frauduleux (rejet, quarantaine, monitoring).  

        ---

        ### 🔗 Manipulation des URL et domaines

        - **Masquage d’URL** : lien affiché différent de la destination réelle  
        - **Raccourcisseurs d’URL** : dissimulation de la cible finale  

        ##### Homographes vs Typosquatting

        - **Homographes** : utilisation de caractères visuellement identiques  
        - **Typosquatting** : exploitation des fautes de frappe  

        👉 Les attaques par homographes sont particulièrement dangereuses car elles ne nécessitent **aucune erreur utilisateur**.
        
        ##### 🛡️ Contre-mesures

        - Activation de la détection des domaines IDN dans les navigateurs  
        - Utilisation de gestionnaires de mots de passe (validation automatique des domaines)  
        - Surveillance et protection des noms de domaine (variantes, TLD)  
        - Sensibilisation des utilisateurs

        ---

        ### 🔐 Credential Harvesting

        Technique consistant à cloner une page de connexion pour voler des identifiants.

        **Principe :**
        - Création d’une copie fidèle d’un site légitime (login, portail, etc.)  
        - Hébergement sur un domaine frauduleux  
        - Collecte des identifiants saisis par la victime  

        **Déroulement typique :**
        1. L’utilisateur clique sur un lien malveillant  
        2. Il accède à une page clonée  
        3. Il saisit ses identifiants  
        4. Les données sont envoyées à l’attaquant  
        5. Redirection vers le site légitime  

        👉 Résultat : l’utilisateur pense à une erreur de connexion, tandis que l’attaquant récupère les accès.
        
        ##### 🛡️ Contre-mesures

        - Authentification multifacteur (MFA)  
        - Sensibilisation à la vérification des URL  
        - Solutions de détection de phishing (EDR, proxy, filtrage DNS) 


        ---

        ### 📎 Delivery de payload

        Une autre approche consiste à inciter la victime à exécuter un fichier :

        - Fichiers Word avec macros (.docm)  
        - Incitation à “Activer le contenu”  
        - Exécution de code en arrière-plan  

        ##### 🛡️ Contre-mesures

        - Désactivation des macros par défaut  
        - Sandbox des pièces jointes  
        - Sensibilisation aux pièces jointes suspectes  
        - Solutions EDR / antivirus  

        En contexte de pentest, ces actions sont simulées avec des charges inoffensives.

        ---

        ## 🧠 La psychologie au cœur des attaques

        Le phishing exploite des mécanismes psychologiques puissants :

        - **Urgence** : pousser à agir rapidement  
        - **Autorité** : se faire passer pour une source légitime  
        - **Peur** : déclencher une réaction immédiate  
        - **Curiosité** : susciter l’intérêt  
        - **Confiance** : reproduire des éléments familiers  

        Ces techniques s’appuient sur des biais cognitifs comme :
        - Surconfiance  
        - Biais d’autorité  
        - Biais de confirmation  

        ---

        ## 🧪 Le phishing en pentest

        Le phishing est un outil essentiel pour évaluer la sécurité d’une organisation via des simulations contrôlées.

        ##### Approche

        - Simulation de campagnes réalistes  
        - Ciblage de groupes spécifiques  
        - Collecte de métriques comportementales  

        ##### Indicateurs clés

        - Taux d’ouverture  
        - Taux de clic  
        - Taux de saisie d’identifiants  
        - Taux de signalement  

        Ces indicateurs permettent d’identifier les axes d’amélioration.

        ---

        ## 🔄 Cycle d’une campagne de phishing

        ![Cycle du phishing](/assets/img/projects/phishing-cycle.png)

        1. Planification  
        2. Reconnaissance (OSINT)  
        3. Conception  
        4. Exécution  
        5. Analyse  

        Ce cycle permet de transformer une simulation en recommandations concrètes.

        ---

        ## 🏁 Conclusion

        Ce travail met en évidence un point fondamental :

        > La cybersécurité est autant une question de technologie que de comportement humain.

        La simulation de phishing permet :
        - d’identifier les faiblesses humaines  
        - de sensibiliser efficacement  
        - d’améliorer durablement la posture de sécurité  

        Une compétence essentielle dans toute démarche de pentest moderne.
        
        
